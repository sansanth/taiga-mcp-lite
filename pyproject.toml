[project]
name = "taiga-mcp-lite"
version = "0.1.0"
description = "A small stdio MCP server for Taiga: list issues, read one with comments and screenshots, comment, change status, assign."
requires-python = ">=3.12"
# mcp 2 renamed FastMCP; this uses the 1.x API.
dependencies = ["mcp>=1.30,<2", "httpx>=0.27", "python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
